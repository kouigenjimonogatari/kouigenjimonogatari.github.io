name: Validate TEI

# xml/master/*.xml を RELAX NG と Schematron で検証する。公開する HTML と内部リンクも検証する（scripts/check-html.zsh）。
# あわせて「ODD から再生成した結果がコミット済みの生成物と一致するか」も確認する
# （ODD を直して再生成を忘れると、スキーマだけ古いまま気づかれない状態になるため）。
#
# master への push と PR で検証する（公開はしない）。
# リリースでは release.yml がこれを呼び出し、通らなければ AIP・公開に進まない（workflow_call）。

on:
  push:
    branches: [master]
    paths:
      - 'xml/master/**'
      - 'odd/**'
      - 'docs/**'
      - 'xsl/**'
      - 'scripts/**'
      - 'CITATION.cff'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'xml/master/**'
      - 'odd/**'
      - 'docs/**'
      - 'xsl/**'
      - 'scripts/**'
      - 'CITATION.cff'
      - '.github/workflows/validate.yml'
  workflow_call:
    inputs:
      ref:
        description: '検証するタグかコミット（空なら呼び出し元の版）'
        type: string
        required: false
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install lxml
        run: pip install lxml

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools
          key: tei-tools-${{ hashFiles('scripts/lib/tools.zsh') }}

      - name: Fetch validation tools
        run: ./scripts/setup-tools.zsh

      - name: Build schema from ODD
        run: ./scripts/build-schema.zsh

      # ODD が正本である以上、生成物がそれと食い違っていてはいけない
      - name: Generated schema must match what is committed
        run: |
          if ! git diff --exit-code -- docs/schema/; then
            echo "::error::docs/schema/ の生成物が ODD と一致しません。./scripts/build-schema.zsh を実行して結果をコミットしてください。"
            exit 1
          fi

      - name: Validate all chapters
        run: ./scripts/validate.zsh

      # seg/@corresp の URI が、TEI 上のページ・行と食い違っていないか
      - name: API URIs must agree with the TEI
        run: python3 scripts/build_api.py --check

      # 版の情報の元は CITATION.cff だけ。それを上げたのに頁に流し忘れると、古い版のまま公開される。
      # 組み立て直して差が出たら落とす（docs/schema と同じ考え方）。CHANGELOG にその版の節があるかも見る
      - name: Version on the pages must match CITATION.cff
        run: |
          python3 scripts/prebuild.py version
          if ! git diff --exit-code -- docs/; then
            echo "::error::頁の版の表示が CITATION.cff と一致しません。python3 scripts/prebuild.py version を実行して結果をコミットしてください。"
            exit 1
          fi
          v=$(sed -n 's/^version: *//p' CITATION.cff)
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "::error::CHANGELOG.md に [$v] の節がありません。"; exit 1; }

      # 公開する HTML（W3C の Nu HTML Checker）と内部リンク（Endings Principles の準拠の条件）
      - name: Build the text pages (docs/html, docs/en/html)
        env:
          SAXON_JAR: tools/saxon/Saxon-HE.jar:tools/saxon/xmlresolver.jar:tools/saxon/xmlresolver-data.jar
        run: python3 scripts/prebuild.py tei xsl

      - name: Validate HTML and internal links
        run: ./scripts/check-html.zsh

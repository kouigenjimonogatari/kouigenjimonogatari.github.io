name: Test release pipeline (temporary)

# 一時的な試験用。PR #17 のマージ前に消す。
# release.yml と同じ手順（SIP → a3m で AIP → BagIt 検証 → AIP の中のソースから DIP を組み立てる）を、
# PR の先頭のコミットで流す。リリースへの添付と公開はしない。

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/test-release.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  A3M_IMAGE: ghcr.io/artefactual-labs/a3m@sha256:daafc45963f622c51c671f367562be73a1fa54c1ee473859cc0d941d687d2db0
  GH_TOKEN: ${{ github.token }}
  REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Assemble SIP
        run: |
          NAME="${GITHUB_REPOSITORY#*/}-test"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          mkdir -p "sip/$NAME" aip
          gh api "repos/${GITHUB_REPOSITORY}/zipball/${REF}" > "sip/$NAME/${NAME}.zip"
          echo "- SIP: $(du -h "sip/$NAME/${NAME}.zip" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          chmod -R a+rwX sip aip

      - name: Build AIP with a3m
        run: |
          set -o pipefail
          start=$(date +%s)
          docker run --rm \
            --volume "$PWD/sip:/sip" \
            --volume "$PWD/aip:/home/a3m/.local/share/a3m/share/completed" \
            --entrypoint python "$A3M_IMAGE" \
            -m a3m.cli.client --name="$NAME" \
            --processing-config=extract_packages=yes \
            --processing-config=delete_packages_after_extraction=no \
            --processing-config=normalize=no \
            "file:///sip/$NAME" 2>&1 | tee a3m.log
          grep -q 'Processing completed successfully' a3m.log
          echo "- AIP: $(du -h aip/*.7z | cut -f1), a3m $(( $(date +%s) - start )) s (pull 込み)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Unpack and validate the bag
        run: |
          7z x -y aip/*.7z -ounpacked > /dev/null
          BAG=$(ls -d unpacked/*/)
          pip install bagit==1.9.0
          python -m bagit --validate "$BAG"
          echo "- PREMIS objects: $(grep -c '<premis:object ' "$BAG"data/METS.*.xml || true)" >> "$GITHUB_STEP_SUMMARY"
          SRC_ZIP=$(ls "$BAG"data/objects/*.zip)
          mkdir src && unzip -q "$SRC_ZIP" -d src
          echo "SRC=$(ls -d "$PWD"/src/*/)" >> "$GITHUB_ENV"

      - run: pip install -r "$SRC/requirements.txt"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - run: |
          curl -sfL -o /tmp/saxon-he.jar https://repo1.maven.org/maven2/net/sf/saxon/Saxon-HE/12.5/Saxon-HE-12.5.jar
          curl -sfL -o /tmp/xmlresolver.jar https://repo1.maven.org/maven2/org/xmlresolver/xmlresolver/6.0.4/xmlresolver-6.0.4.jar

      - name: Generate DIP from the AIP
        env:
          SAXON_JAR: /tmp/saxon-he.jar:/tmp/xmlresolver.jar
        run: |
          start=$(date +%s)
          python3 "$SRC/scripts/prebuild.py" tei xsl waka stats api epub
          (cd "$SRC/docs" && zip -qr -X "$GITHUB_WORKSPACE/dip.zip" .)
          echo "- DIP: $(du -h dip.zip | cut -f1), files $(find "$SRC/docs" -type f | wc -l), build $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"

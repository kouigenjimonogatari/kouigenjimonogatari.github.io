name: Release (SIP → AIP → DIP → Pages)

# リリースのたびに、OAIS 参照モデルの情報パッケージの考え方で保存と公開を行う。
#
#   1. validate  タグの版を RELAX NG / Schematron で検証する（通らなければ止まる）
#   2. aip       SIP = GitHub のソース zip（Zenodo が保存するものと同じファイル）。
#                a3m（軽量版 Archivematica）で AIP（BagIt + METS/PREMIS）を作り、リリースに添付する
#   3. dip       リリースに添付した AIP を取り直し、検証し、その中のソースからサイトを組み立てる。
#                組み立てたサイト一式を DIP として zip にし、リリースに添付する
#   4. deploy    リリースに添付した DIP を取り直し、そのまま GitHub Pages（アクセスシステム）に置く
#
# 各段は、前の段の「保存先（リリース）に置いた成果物」から作る。ジョブ間で直接受け渡さない。
#
# AIP と DIP は一度添付したら作り直さない。a3m は実行のたびに UUID と日時を書き込むので、
# 作り直すと同じ版でもチェックサムが変わり、東大のリポジトリなどに置いた写しと食い違うため。
# 作り直したいときは、リリースから該当の添付ファイルを手で消してから流す。
#
# master への push では公開しない（版を区切って出す）。
# 公開するのは最新のリリースだけ。古いタグで手で流しても、AIP・DIP は作るがサイトは戻さない。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'AIP と DIP を作るタグ（例: v1.0.0）'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # a3m は版の付いたリリースが無いので、イメージをダイジェストで固定する
  A3M_IMAGE: ghcr.io/artefactual-labs/a3m@sha256:daafc45963f622c51c671f367562be73a1fa54c1ee473859cc0d941d687d2db0
  GH_TOKEN: ${{ github.token }}

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}

  aip:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write   # リリースに AIP を添付する
    steps:
      - name: Skip if the AIP is already attached
        id: check
        run: |
          NAME="${GITHUB_REPOSITORY#*/}-${TAG}"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx "${NAME}-aip.7z"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "### AIP: 既に添付済みのため作り直さない (\`${NAME}-aip.7z\`)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Assemble SIP (source zip of the tag)
        if: steps.check.outputs.exists != 'true'
        run: |
          mkdir -p "sip/$NAME" aip
          gh api "repos/${GITHUB_REPOSITORY}/zipball/${TAG}" > "sip/$NAME/${NAME}.zip"
          {
            echo "### SIP"
            echo "- file: \`${NAME}.zip\`"
            echo "- MD5: \`$(md5sum "sip/$NAME/${NAME}.zip" | cut -d' ' -f1)\`"
            echo "- SHA-256: \`$(sha256sum "sip/$NAME/${NAME}.zip" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
          # a3m はコンテナ内の別ユーザーで動くので、書き込めるようにしておく
          chmod -R a+rwX sip aip

      - name: Build AIP with a3m
        if: steps.check.outputs.exists != 'true'
        run: |
          set -o pipefail
          docker run --rm \
            --volume "$PWD/sip:/sip" \
            --volume "$PWD/aip:/home/a3m/.local/share/a3m/share/completed" \
            --entrypoint python "$A3M_IMAGE" \
            -m a3m.cli.client --name="$NAME" \
            --processing-config=extract_packages=yes \
            --processing-config=delete_packages_after_extraction=no \
            --processing-config=normalize=no \
            "file:///sip/$NAME" 2>&1 | tee a3m.log
          grep -q 'Processing completed successfully' a3m.log
          f=$(ls aip/*.7z)
          mv "$f" "aip/${NAME}-aip.7z"
          (cd aip && sha256sum "${NAME}-aip.7z" > "${NAME}-aip.7z.sha256")
          {
            echo "### AIP"
            echo "- a3m: \`$A3M_IMAGE\`"
            echo "- AIP UUID: \`$(basename "$f" .7z | grep -oE '[0-9a-f-]{36}$')\`"
            echo "- SHA-256: \`$(cut -d' ' -f1 "aip/${NAME}-aip.7z.sha256")\`"
            echo "- size: $(du -h "aip/${NAME}-aip.7z" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      # --clobber は付けない。同名があれば失敗させ、黙って上書きしない
      - name: Attach AIP to the release
        if: steps.check.outputs.exists != 'true'
        run: gh release upload "$TAG" "aip/${NAME}-aip.7z" "aip/${NAME}-aip.7z.sha256" -R "$GITHUB_REPOSITORY"

  dip:
    needs: aip
    runs-on: ubuntu-latest
    permissions:
      contents: write   # リリースに DIP を添付する
    steps:
      - name: Skip if the DIP is already attached
        id: check
        run: |
          NAME="${GITHUB_REPOSITORY#*/}-${TAG}"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx "${NAME}-dip.zip"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "### DIP: 既に添付済みのため作り直さない (\`${NAME}-dip.zip\`)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ジョブ間の受け渡しではなく、保存先（リリース）に置いた AIP そのものから作る
      - name: Retrieve AIP from the release
        if: steps.check.outputs.exists != 'true'
        run: |
          gh release download "$TAG" -p "${NAME}-aip.7z" -p "${NAME}-aip.7z.sha256" -R "$GITHUB_REPOSITORY"
          sha256sum -c "${NAME}-aip.7z.sha256"

      - name: Set up Python
        if: steps.check.outputs.exists != 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Unpack and validate the bag
        if: steps.check.outputs.exists != 'true'
        run: |
          7z x -y "${NAME}-aip.7z" -oaip > /dev/null
          BAG=$(ls -d aip/*/)
          pip install bagit==1.9.0
          python -m bagit --validate "$BAG"
          # AIP に入っている元の zip（SIP）を取り出し、そこから組み立てる
          SRC_ZIP=$(ls "$BAG"data/objects/*.zip)
          mkdir src && unzip -q "$SRC_ZIP" -d src
          echo "SRC=$(ls -d "$PWD"/src/*/)" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        if: steps.check.outputs.exists != 'true'
        run: pip install -r "$SRC/requirements.txt"

      - name: Set up Java
        if: steps.check.outputs.exists != 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download Saxon-HE and xmlresolver
        if: steps.check.outputs.exists != 'true'
        run: |
          curl -sfL -o /tmp/saxon-he.jar https://repo1.maven.org/maven2/net/sf/saxon/Saxon-HE/12.5/Saxon-HE-12.5.jar
          curl -sfL -o /tmp/xmlresolver.jar https://repo1.maven.org/maven2/org/xmlresolver/xmlresolver/6.0.4/xmlresolver-6.0.4.jar

      - name: Generate DIP from the AIP (tei, xsl, waka, stats, api, epub)
        if: steps.check.outputs.exists != 'true'
        env:
          SAXON_JAR: /tmp/saxon-he.jar:/tmp/xmlresolver.jar
        run: python3 "$SRC/scripts/prebuild.py" tei xsl waka stats api epub

      # DIP が、どの AIP から、どの道具で作られたかを、サイトの中に残す
      - name: Record provenance in the DIP
        if: steps.check.outputs.exists != 'true'
        run: |
          python3 - "$SRC/docs/build-info.json" <<'PY'
          import json, subprocess, sys, datetime, os
          name = os.environ["NAME"]
          aip_sha = open(f"{name}-aip.7z.sha256").read().split()[0]
          commit = subprocess.run(["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['TAG']}", "-q", ".sha"], capture_output=True, text=True, check=True).stdout.strip()
          java = subprocess.run(["java", "-version"], capture_output=True, text=True).stderr.splitlines()[0]
          freeze = subprocess.run([sys.executable, "-m", "pip", "freeze"], capture_output=True, text=True, check=True).stdout.split()
          info = {
              "tag": os.environ["TAG"],
              "commit": commit,
              "aip": {"file": f"{name}-aip.7z", "sha256": aip_sha},
              "built_at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "workflow_run": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "tools": {"python": sys.version.split()[0], "java": java, "saxon": "Saxon-HE 12.5", "xmlresolver": "6.0.4", "pip": freeze},
          }
          json.dump(info, open(sys.argv[1], "w"), ensure_ascii=False, indent=2)
          PY

      - name: Package and attach DIP
        if: steps.check.outputs.exists != 'true'
        run: |
          (cd "$SRC/docs" && zip -qr -X "$GITHUB_WORKSPACE/${NAME}-dip.zip" .)
          sha256sum "${NAME}-dip.zip" > "${NAME}-dip.zip.sha256"
          {
            echo "### DIP"
            echo "- SHA-256: \`$(cut -d' ' -f1 "${NAME}-dip.zip.sha256")\`"
            echo "- size: $(du -h "${NAME}-dip.zip" | cut -f1) / files: $(find "$SRC/docs" -type f | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"
          gh release upload "$TAG" "${NAME}-dip.zip" "${NAME}-dip.zip.sha256" -R "$GITHUB_REPOSITORY"

  deploy:
    needs: dip
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # 公開するのは最新のリリースだけ（古いタグで流したときにサイトを戻さない）
      - name: Check that this is the latest release
        id: latest
        run: |
          LATEST=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          if [ "$LATEST" = "$TAG" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "### 公開しない: 最新のリリースは \`$LATEST\`（このタグは \`$TAG\`）" >> "$GITHUB_STEP_SUMMARY"
          fi

      # アクセスシステムは DIP を組み立て直さず、保存先に置いた DIP をそのまま置く
      - name: Retrieve DIP from the release
        if: steps.latest.outputs.ok == 'true'
        run: |
          NAME="${GITHUB_REPOSITORY#*/}-${TAG}"
          gh release download "$TAG" -p "${NAME}-dip.zip" -p "${NAME}-dip.zip.sha256" -R "$GITHUB_REPOSITORY"
          sha256sum -c "${NAME}-dip.zip.sha256"
          mkdir site && unzip -q "${NAME}-dip.zip" -d site

      - name: Upload Pages artifact
        if: steps.latest.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.latest.outputs.ok == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: Release (SIP → AIP → Zenodo → DIP → Pages)

# リリースのたびに、OAIS 参照モデルの情報パッケージの考え方で保存と公開を行う。
#
#   1. validate  タグの版を RELAX NG / Schematron で検証する（通らなければ止まる）
#   2. aip       SIP = GitHub のソース zip と、その commit を書いた metadata.csv。a3m（軽量版 Archivematica）が
#                zip を展開して元の zip は残さず、AIP（BagIt + METS/PREMIS）を作り、
#                同じジョブの中で Zenodo の API に上げて公開する（DOI が付く）。そのあとリリースにも添付する
#   3. dip       リリースに添付した AIP を取り直し、その MD5 を Zenodo の記録の AIP と突き合わせる。
#                合えば、中のソースを記録された commit と 1 ファイルずつ照らし（git で取り直す）、
#                そこからサイトを組み立て、DIP として zip にしてリリースに添付する
#   4. deploy    リリースに添付した DIP を取り直し、そのまま GitHub Pages（アクセスシステム）に置く
#
# なぜ Zenodo と突き合わせるか: GitHub に書き込める者は、添付の AIP と SHA-256 を一緒に差し替えられる。
# 公開済みの Zenodo の記録は GitHub の外にあり、ファイルを差し替えられない（所有者による公開後 30 日以内の
# 修正は除く）。AIP を作った直後の値を Zenodo に置いて正とする。
# 同じ版名（version == タグ）の記録が複数あれば、created の最も古いものだけを正とする（.github/scripts/zenodo.py）。
#
# Zenodo の GitHub 連携（リリースのたびにソース zip を自動で取り込む）は止めておくこと。止めないと、
# 同じ版名の記録が 2 つでき、連携の記録（AIP を含まない）が先に作られると、dip の段が止まる。
#
# 設定（secrets は Settings → Environments → zenodo、vars は Settings → Secrets and variables → Actions）。
# 入れ方は scripts/setup/zenodo-token.zsh:
#   secrets.ZENODO_TOKEN / ZENODO_SANDBOX_TOKEN   本番 / sandbox の個人用トークン（deposit:write・deposit:actions）
#   vars.ZENODO_API                               API の基点（既定 https://zenodo.org/api）
#   vars.ZENODO_DEPOSITION_ID                     新しい版を足す元の記録（概念のどの版の ID でもよい）。空なら新規の記録
#   vars.ZENODO_SANDBOX_DEPOSITION_ID             sandbox での同じもの（試験は空のまま＝毎回新規、が扱いやすい）
#
# 試験: Actions の画面から workflow_dispatch で mode を sandbox-test にして流す。既存のタグで AIP を作り、
# sandbox.zenodo.org に公開し、Actions の成果物（artifact）経由で dip の段の照合と組み立てまで行う。
# リリースへの添付・GitHub Pages への公開はしない。
#
# AIP と DIP は一度添付したら作り直さない。a3m は実行のたびに UUID と日時を書き込むので、
# 作り直すと同じ版でもチェックサムが変わり、Zenodo の記録や東大のリポジトリに置いた写しと食い違うため。
# 途中で失敗して流し直したとき、Zenodo に公開済みならその AIP を取り出してリリースに添付する（作り直さない）。
#
# master への push では公開しない（版を区切って出す）。
# 公開するのは最新のリリースだけ。古いタグで手で流しても、AIP・DIP は作るがサイトは戻さない。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'AIP と DIP を作るタグ（例: v1.0.0）'
        required: true
      mode:
        description: 'sandbox-test = sandbox.zenodo.org に公開して照合まで（リリースと Pages は触らない） / release = 本番'
        type: choice
        options: [sandbox-test, release]
        default: sandbox-test

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  TEST: ${{ inputs.mode == 'sandbox-test' }}
  # 試験では、変数の値にかかわらず sandbox を使う
  ZENODO_API: ${{ inputs.mode == 'sandbox-test' && 'https://sandbox.zenodo.org/api' || vars.ZENODO_API || 'https://zenodo.org/api' }}
  # どちらを使うかは zenodo.py が API の基点で選ぶ（本番の ID・トークンを sandbox に渡さない）
  ZENODO_DEPOSITION_ID: ${{ vars.ZENODO_DEPOSITION_ID }}
  ZENODO_SANDBOX_DEPOSITION_ID: ${{ vars.ZENODO_SANDBOX_DEPOSITION_ID }}
  # a3m は版の付いたリリースが無いので、イメージをダイジェストで固定する
  A3M_IMAGE: ghcr.io/artefactual-labs/a3m@sha256:daafc45963f622c51c671f367562be73a1fa54c1ee473859cc0d941d687d2db0
  GH_TOKEN: ${{ github.token }}
  ZENODO_PY: wf/.github/scripts/zenodo.py

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}

  aip:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write   # リリースに AIP を添付する
    # Zenodo のトークンは、この environment の secret に置く。environment に「承認者」と「タグだけ」の
    # 制限を付けると、書き込める者が別のワークフローからトークンを使うことを防げる（付けないと防げない）
    environment: zenodo
    outputs:
      record_id: ${{ steps.publish.outputs.record_id || steps.state.outputs.record_id }}
      aip_md5: ${{ steps.publish.outputs.aip_md5 || steps.state.outputs.aip_md5 }}
    steps:
      # zenodo.py は、このワークフローと同じ版のものを使う（タグの版には無いことがあるため）
      - name: Check out the workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: wf
          sparse-checkout: .github/scripts
          persist-credentials: false

      # 何が既にあるかで、作る・取り直す・止めるを決める
      #   Zenodo に正の記録がある   → 作り直さない（リリースに無ければ Zenodo から取り出して添付する）
      #   リリースにだけ AIP がある → 止める（Zenodo に守られていない AIP なので、手で消してから流し直す）
      #   どちらにも無い            → 作る
      - name: Check what already exists
        id: state
        run: |
          set -o pipefail
          NAME="${GITHUB_REPOSITORY#*/}-${TAG}"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          has=false
          if [ "$TEST" != true ] && gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx "${NAME}-aip.7z"; then
            has=true
          fi
          echo "release_has_aip=$has" >> "$GITHUB_OUTPUT"
          found=$(python3 "$ZENODO_PY" lookup --tag "$TAG" | sed -n 's/^found=//p')
          if [ "$found" = true ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "### AIP: Zenodo に公開済みのため作り直さない" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$has" = true ]; then
            echo "::error::リリースに ${NAME}-aip.7z があるが、Zenodo に版 ${TAG} の AIP の記録が無い。添付を手で消してから流し直す"
            exit 1
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore AIP from Zenodo
        if: steps.state.outputs.build == 'false' && (env.TEST == 'true' || steps.state.outputs.release_has_aip != 'true')
        env:
          RECORD_ID: ${{ steps.state.outputs.record_id }}
        run: |
          mkdir -p aip
          python3 "$ZENODO_PY" download --record-id "$RECORD_ID" --out-dir aip
          (cd aip && sha256sum "${NAME}-aip.7z" > "${NAME}-aip.7z.sha256")
          if [ "$TEST" != true ]; then
            gh release upload "$TAG" "aip/${NAME}-aip.7z" "aip/${NAME}-aip.7z.sha256" -R "$GITHUB_REPOSITORY"
          fi

      - name: Assemble SIP (source zip of the tag)
        if: steps.state.outputs.build == 'true'
        run: |
          mkdir -p "sip/$NAME" aip
          gh api "repos/${GITHUB_REPOSITORY}/zipball/${TAG}" > "sip/$NAME/${NAME}.zip"
          {
            echo "### SIP"
            echo "- file: \`${NAME}.zip\`"
            echo "- MD5: \`$(md5sum "sip/$NAME/${NAME}.zip" | cut -d' ' -f1)\`"
            echo "- SHA-256: \`$(sha256sum "sip/$NAME/${NAME}.zip" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
          # Zenodo のメタデータは、タグの版の .zenodo.json と CITATION.cff から作る
          mkdir meta && unzip -q -j "sip/$NAME/${NAME}.zip" '*/.zenodo.json' '*/CITATION.cff' -d meta
          # Record which commit the zip was made from, in the AIP itself (METS dmdSec, Dublin Core).
          # The zip is not byte-stable over time, so provenance rests on the commit, not on the zip's hash.
          mkdir -p "sip/$NAME/metadata"
          COMMIT=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" -q .sha)
          COMMIT_DATE=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" -q .commit.committer.date | cut -c1-10)
          python3 - "sip/$NAME/metadata/metadata.csv" "$COMMIT" "$COMMIT_DATE" <<'PY'
          import csv, json, os, sys
          out, commit, date = sys.argv[1:4]
          repo, tag = os.environ["GITHUB_REPOSITORY"], os.environ["TAG"]
          title = json.load(open("meta/.zenodo.json", encoding="utf-8"))["title"]
          with open(out, "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(["filename", "dc.title", "dc.identifier", "dc.source", "dc.date"])
              w.writerow(["objects", f"{title} {tag}", f"https://github.com/{repo}/commit/{commit}",
                          f"https://github.com/{repo}/releases/tag/{tag}", date])
          PY
          echo "- commit: \`$COMMIT\`" >> "$GITHUB_STEP_SUMMARY"
          # a3m はコンテナ内の別ユーザーで動くので、書き込めるようにしておく
          chmod -R a+rwX sip aip

      # Policy checks on originals are skipped: they only apply MediaConch
      # policies to audio/video, and with the zip deleted after extraction
      # a3m stalled at this job (2026-11-13, both locally and on Actions).
      - name: Build AIP with a3m
        if: steps.state.outputs.build == 'true'
        run: |
          set -o pipefail
          docker run --rm \
            --volume "$PWD/sip:/sip" \
            --volume "$PWD/aip:/home/a3m/.local/share/a3m/share/completed" \
            --entrypoint python "$A3M_IMAGE" \
            -m a3m.cli.client --name="$NAME" \
            --processing-config=extract_packages=yes \
            --processing-config=delete_packages_after_extraction=yes \
            --processing-config=perform_policy_checks_on_originals=no \
            --processing-config=normalize=no \
            "file:///sip/$NAME" 2>&1 | tee a3m.log
          grep -q 'Processing completed successfully' a3m.log
          f=$(ls aip/*.7z)
          mv "$f" "aip/${NAME}-aip.7z"
          (cd aip && sha256sum "${NAME}-aip.7z" > "${NAME}-aip.7z.sha256")
          {
            echo "### AIP"
            echo "- a3m: \`$A3M_IMAGE\`"
            echo "- AIP UUID: \`$(basename "$f" .7z | grep -oE '[0-9a-f-]{36}$')\`"
            echo "- MD5: \`$(md5sum "aip/${NAME}-aip.7z" | cut -d' ' -f1)\`"
            echo "- SHA-256: \`$(cut -d' ' -f1 "aip/${NAME}-aip.7z.sha256")\`"
            echo "- size: $(du -h "aip/${NAME}-aip.7z" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      # AIP を作った直後に、GitHub の外（Zenodo）へ置いて公開する。リリースへの添付はその後
      - name: Publish AIP to Zenodo
        if: steps.state.outputs.build == 'true'
        id: publish
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_SANDBOX_TOKEN: ${{ secrets.ZENODO_SANDBOX_TOKEN }}
        run: python3 "$ZENODO_PY" publish --tag "$TAG" --aip "aip/${NAME}-aip.7z" --meta-dir meta

      # --clobber は付けない。同名があれば失敗させ、黙って上書きしない
      - name: Attach AIP to the release
        if: steps.state.outputs.build == 'true' && env.TEST != 'true'
        run: gh release upload "$TAG" "aip/${NAME}-aip.7z" "aip/${NAME}-aip.7z.sha256" -R "$GITHUB_REPOSITORY"

      # 試験ではリリースを触らないので、成果物（artifact）として dip の段に渡す
      - name: Hand the AIP to the dip job (sandbox-test only)
        if: env.TEST == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aip
          path: aip/${{ env.NAME }}-aip.7z*
          retention-days: 1
          if-no-files-found: error

  dip:
    needs: aip
    runs-on: ubuntu-latest
    permissions:
      contents: write   # リリースに DIP を添付する
    env:
      # aip の段で公開した（または既にあった）記録。この記録の AIP と突き合わせる
      RECORD_ID: ${{ needs.aip.outputs.record_id }}
    steps:
      - name: Skip if the DIP is already attached
        id: check
        run: |
          NAME="${GITHUB_REPOSITORY#*/}-${TAG}"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          if [ "$TEST" != true ] && gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx "${NAME}-dip.zip"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "### DIP: 既に添付済みのため作り直さない (\`${NAME}-dip.zip\`)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out the workflow scripts
        if: steps.check.outputs.exists != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: wf
          sparse-checkout: .github/scripts
          persist-credentials: false

      # ジョブ間の受け渡しではなく、保存先（リリース）に置いた AIP そのものから作る
      - name: Retrieve AIP from the release
        if: steps.check.outputs.exists != 'true' && env.TEST != 'true'
        run: gh release download "$TAG" -p "${NAME}-aip.7z" -p "${NAME}-aip.7z.sha256" -R "$GITHUB_REPOSITORY"

      - name: Retrieve AIP from the aip job (sandbox-test only)
        if: steps.check.outputs.exists != 'true' && env.TEST == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aip

      # SHA-256 の添付は AIP と一緒に差し替えられるので、守りにはならない（壊れた転送の検出だけ）。
      # 守りは Zenodo の記録との突き合わせ。合わなければここで止め、展開も組み立てもしない
      - name: Check the AIP against the Zenodo record
        if: steps.check.outputs.exists != 'true'
        id: verify
        run: |
          sha256sum -c "${NAME}-aip.7z.sha256"
          python3 "$ZENODO_PY" verify --tag "$TAG" --record-id "$RECORD_ID" --aip "${NAME}-aip.7z"

      - name: Set up Python
        if: steps.check.outputs.exists != 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Unpack and validate the bag
        if: steps.check.outputs.exists != 'true'
        run: |
          7z x -y "${NAME}-aip.7z" -oaip > /dev/null
          BAG=$(ls -d aip/*/)
          pip install bagit==1.9.0
          python -m bagit --validate "$BAG"
          # Build from the source tree that a3m extracted into the AIP (the zip itself is not kept).
          # a3m names the folder <zip name>-<timestamp>; inside it is GitHub's <owner>-<repo>-<sha> folder
          set -- "$BAG"data/objects/"${NAME}".zip-*/*/
          if [ "$#" -ne 1 ] || [ ! -d "$1" ]; then echo "expected one source folder in the AIP, got: $*"; exit 1; fi
          SRC=$(cd "$1" && pwd)/
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          # The commit recorded in the AIP (metadata.csv, also in the METS dmdSec)
          CSV=$(find "$BAG"data/objects/metadata -name metadata.csv | head -1)
          COMMIT=$(python3 -c 'import csv,sys; r=next(csv.DictReader(open(sys.argv[1],encoding="utf-8"))); print(r["dc.identifier"].rsplit("/",1)[1])' "$CSV")
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
          grep -q "commit/$COMMIT" "$BAG"data/METS.*.xml

      # The AIP only records the commit. Check that its content really is that commit:
      # fetch the commit from GitHub with git and compare every file by git's blob hash.
      # Any file missing, added, or changed (including hidden files a3m might drop) stops the run here
      - name: Compare the AIP's source with the recorded commit
        if: steps.check.outputs.exists != 'true'
        run: |
          git init -q cmp
          git -C cmp fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$COMMIT"
          git -C cmp -c core.quotePath=false ls-tree -r --format='%(objectname) %(path)' FETCH_HEAD | sort -k2 > want.txt
          (cd "$SRC" && find . -type f | sed 's|^\./||' | LC_ALL=C sort > "$GITHUB_WORKSPACE/files.txt" && git hash-object --no-filters --stdin-paths < "$GITHUB_WORKSPACE/files.txt" > "$GITHUB_WORKSPACE/hashes.txt")
          paste -d' ' hashes.txt files.txt | sort -k2 > got.txt
          if diff want.txt got.txt > cmp.diff; then
            echo "### Source = commit \`$COMMIT\`: $(wc -l < want.txt) files match" >> "$GITHUB_STEP_SUMMARY"
          else
            { echo "### Source ≠ commit \`$COMMIT\`"; echo '```'; head -40 cmp.diff; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            cat cmp.diff; exit 1
          fi

      - name: Install Python dependencies
        if: steps.check.outputs.exists != 'true'
        run: pip install -r "$SRC/requirements.txt"

      - name: Set up Java
        if: steps.check.outputs.exists != 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download Saxon-HE and xmlresolver
        if: steps.check.outputs.exists != 'true'
        run: |
          curl -sfL -o /tmp/saxon-he.jar https://repo1.maven.org/maven2/net/sf/saxon/Saxon-HE/12.5/Saxon-HE-12.5.jar
          curl -sfL -o /tmp/xmlresolver.jar https://repo1.maven.org/maven2/org/xmlresolver/xmlresolver/6.0.4/xmlresolver-6.0.4.jar

      - name: Generate DIP from the AIP (tei, xsl, waka, stats, api, epub)
        if: steps.check.outputs.exists != 'true'
        env:
          SAXON_JAR: /tmp/saxon-he.jar:/tmp/xmlresolver.jar
        run: |
          set -o pipefail
          python3 "$SRC/scripts/prebuild.py" tei xsl waka stats api epub 2>&1 | tee build.log
          # prebuild.py は、一部の帖で失敗しても最後まで進み、成功で終わる
          if grep -n 'FAILED' build.log; then exit 1; fi

      # 組み立ては、元の TEI や XSLT が欠けていても成功で終わる（欠けた分を黙って飛ばす）。
      # 54 帖それぞれについて、元の TEI と、DIP の TEI・HTML（日本語・英語）・EPUB がそろっているかを確かめる
      - name: Check that the DIP covers all 54 chapters
        if: steps.check.outputs.exists != 'true'
        run: |
          python3 - "$SRC" <<'PY'
          import json, os, sys
          src = sys.argv[1]
          need = ["xml/master/{}.xml", "docs/tei/{}.xml", "docs/html/{}.html", "docs/en/html/{}.html", "docs/epub/{}.epub"]
          paths = [p.format(f"{i:02d}") for i in range(1, 55) for p in need]
          missing = [p for p in paths if not os.path.isfile(os.path.join(src, p)) or os.path.getsize(os.path.join(src, p)) == 0]
          chapters = json.load(open(os.path.join(src, "docs/data/chapters.json"), encoding="utf-8"))
          got = sorted(c["chapter"] for c in chapters)
          if got != [f"{i:02d}" for i in range(1, 55)]:
              missing.append(f"docs/data/chapters.json（{len(got)} 帖）")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              print(f"### DIP のそろい: {'54 帖そろっている' if not missing else f'**{len(missing)} 件が欠けている**'}", file=out)
              for m in missing[:20]:
                  print(f"- 欠け: `{m}`", file=out)
          for m in missing:
              print("missing:", m)
          sys.exit(1 if missing else 0)
          PY

      # DIP が、どの AIP から、どの道具で作られたかを、サイトの中に残す
      - name: Record provenance in the DIP
        if: steps.check.outputs.exists != 'true'
        env:
          ZENODO_DOI: ${{ steps.verify.outputs.doi }}
        run: |
          python3 - "$SRC/docs/build-info.json" <<'PY'
          import json, subprocess, sys, datetime, os
          name = os.environ["NAME"]
          aip_sha = open(f"{name}-aip.7z.sha256").read().split()[0]
          # The commit recorded in the AIP, checked against the AIP's content in the step above
          commit = os.environ["COMMIT"]
          java = subprocess.run(["java", "-version"], capture_output=True, text=True).stderr.splitlines()[0]
          freeze = subprocess.run([sys.executable, "-m", "pip", "freeze"], capture_output=True, text=True, check=True).stdout.split()
          info = {
              "tag": os.environ["TAG"],
              "commit": commit,
              "aip": {"file": f"{name}-aip.7z", "sha256": aip_sha},
              "zenodo": {"api": os.environ["ZENODO_API"], "record": os.environ["RECORD_ID"], "doi": os.environ.get("ZENODO_DOI", "")},
              "built_at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "workflow_run": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "tools": {"python": sys.version.split()[0], "java": java, "saxon": "Saxon-HE 12.5", "xmlresolver": "6.0.4", "pip": freeze},
          }
          json.dump(info, open(sys.argv[1], "w"), ensure_ascii=False, indent=2)
          PY

      - name: Package and attach DIP
        if: steps.check.outputs.exists != 'true'
        run: |
          (cd "$SRC/docs" && zip -qr -X "$GITHUB_WORKSPACE/${NAME}-dip.zip" .)
          sha256sum "${NAME}-dip.zip" > "${NAME}-dip.zip.sha256"
          {
            echo "### DIP"
            echo "- SHA-256: \`$(cut -d' ' -f1 "${NAME}-dip.zip.sha256")\`"
            echo "- size: $(du -h "${NAME}-dip.zip" | cut -f1) / files: $(find "$SRC/docs" -type f | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TEST" = true ]; then
            echo "- sandbox-test のため、リリースには添付しない" >> "$GITHUB_STEP_SUMMARY"
          else
            gh release upload "$TAG" "${NAME}-dip.zip" "${NAME}-dip.zip.sha256" -R "$GITHUB_REPOSITORY"
          fi

  deploy:
    needs: dip
    if: inputs.mode != 'sandbox-test'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # 公開するのは最新のリリースだけ（古いタグで流したときにサイトを戻さない）
      - name: Check that this is the latest release
        id: latest
        run: |
          LATEST=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          if [ "$LATEST" = "$TAG" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "### 公開しない: 最新のリリースは \`$LATEST\`（このタグは \`$TAG\`）" >> "$GITHUB_STEP_SUMMARY"
          fi

      # アクセスシステムは DIP を組み立て直さず、保存先に置いた DIP をそのまま置く
      - name: Retrieve DIP from the release
        if: steps.latest.outputs.ok == 'true'
        run: |
          NAME="${GITHUB_REPOSITORY#*/}-${TAG}"
          gh release download "$TAG" -p "${NAME}-dip.zip" -p "${NAME}-dip.zip.sha256" -R "$GITHUB_REPOSITORY"
          sha256sum -c "${NAME}-dip.zip.sha256"
          mkdir site && unzip -q "${NAME}-dip.zip" -d site

      - name: Upload Pages artifact
        if: steps.latest.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.latest.outputs.ok == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
